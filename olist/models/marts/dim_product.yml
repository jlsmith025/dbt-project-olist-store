version: 2

models:
  - name: dim_product
    description: >
      Product-grain dimension table. One row per product_id, combining product
      attributes from stg__products with cleaned, title-cased category names
      (Portuguese original and English translation) joined in from
      stg__product_category_name_translation.
    columns:
      - name: product_key
        description: Surrogate key for the product, generated as an MD5 hash of product_id.
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: Natural key identifying a unique product.
        data_tests:
          - not_null

      - name: product_category_name
        description: Product category name in Portuguese.

      - name: product_category_name_english
        description: English translation of the product category name.

      - name: product_photo_count
        description: Number of photos published for the product listing.

      - name: product_weight_g
        description: Weight of the product, in grams.

      - name: product_length_cm
        description: Length of the product, in centimeters.

      - name: product_height_cm
        description: Height of the product, in centimeters.

      - name: product_width_cm
        description: Width of the product, in centimeters.