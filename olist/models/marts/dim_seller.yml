version: 2

models:
  - name: dim_seller
    description: >
      Seller-grain dimension table. One row per seller_id, combining seller
      attributes from stg__sellers with geographic coordinates joined in from
      int__geolocation_flattened via zip code.
    columns:
      - name: seller_key
        description: Surrogate key for the seller, generated as an MD5 hash of seller_id.
        data_tests:
          - unique
          - not_null

      - name: seller_id
        description: Natural key identifying a unique seller.
        data_tests:
          - not_null

      - name: seller_name
        description: Name of the seller.

      - name: seller_city
        description: City where the seller is located

      - name: seller_state
        description: State where the seller is located.

      - name: seller_zip_code
        description: Zip code where the seller is located.

      - name: seller_latitude
        description: Latitude of the seller's zip code, sourced from geolocation data.

      - name: seller_longitude
        description: Longitude of the seller's zip code, sourced from geolocation data.