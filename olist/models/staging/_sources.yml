version: 2

sources:
  - name: olist
    database: raw
    schema: olist
    description: >
      Raw Brazilian e-commerce data from Olist (Kaggle: olistbr/brazilian-ecommerce).
      One CSV per table, loaded as-is with no transformation.
    tables:
      
      - name: customers
        description: >
          One row per order-scoped customer_id. customer_unique_id identifies the
          actual person and repeats across orders, so it is not_null but not unique here.
          Grain = customer_id.
        columns:
          - name: customer_id
            description: Key to the orders dataset. Each order has a unique customer_id.
            tests:
              - unique
              - not_null
          - name: customer_unique_id
            description: Unique identifier of a customer.
            tests:
              - not_null
          - name: customer_zip_code_prefix
            description: First five digits of customer zip code
            tests:
              - not_null
          - name: customer_city
            description: Customer city name
            tests:
              - not_null
          - name: customer_state
            description: Customer state
            tests:
              - not_null

      - name: orders
        description: One row per order. Grain = order_id.
        columns:
          - name: order_id
            description: Unique identifier of the order.
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Key to the customer dataset. Each order has a unique customer_id.
            tests:
              - not_null
          - name: order_status
            description: Reference to the order status (delivered, shipped, etc).
            tests:
              - not_null
          - name: order_purchase_timestamp
            description: Shows the purchase timestamp.
            tests:
              - not_null
          - name: order_approved_at
            description: Shows the payment approval timestamp.
          - name: order_delivered_carrier_date
            description: Shows the order posting timestamp. When it was handled to the logistic partne
          - name: order_delivered_customer_date
            description: Shows the actual order delivery date to the customer.
          - name: order_estimated_delivery_date
            description: Shows the estimated delivery date that was informed to customer at the purchase moment.
            tests:
              - not_null
              
      - name: geolocation
        description: >
          Zip-code-level lat/lng lookup. Not a clean grain — the same
          zip_code_prefix repeats across many lat/lng points, so no
          uniqueness test is applied at the source.
        columns:
          - name: geolocation_zip_code_prefix
            description: First 5 digits of zip code
            tests:
              - not_null
          - name: geolocation_lat
            description: location latitude
            tests:
              - not_null
          - name: geolocation_lng
            description: location latitude
            tests:
              - not_null
          - name: geolocation_city
            description: location city
            tests:
              - not_null
          - name: geolocation_state
            description:  location state
            tests:
              - not_null
      
      - name: order_items
        description: One row per order line item. Grain = order_id + order_item_id.
        columns:
          - name: order_id
            description: order unique identifier
            tests:
              - not_null
          - name: order_item_id
            description: sequential number identifying number of items included in the same order.
            tests:
              - not_null
          - name: product_id
            description: product unique identifier
            tests:
              - not_null
          - name: seller_id
            description: seller unique identifier
            tests:
              - not_null
          - name: shipping_limit_date
            description: Shows the seller shipping limit date for handling the order over to the logistic partner.
            tests:
              - not_null
          - name: price
            description: item price
            tests:
              - not_null
          - name: freight_value
            description: item freight value item (if an order has more than one item the freight value is splitted between items)
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - order_id
                  - order_item_id

      - name: order_payments
        description: One row per payment installment/method applied to an order. Grain = order_id + payment_sequential.
        columns:
          - name: order_id
            description: unique identifier of an order.
            tests:
              - not_null
          - name: payment_sequential
            description: a customer may pay an order with more than one payment method. If he does so, a sequence will be created to accommodate all payments.
            tests:
              - not_null
          - name: payment_type
            description: method of payment chosen by the customer.
            tests:
              - not_null
          - name: payment_installments
            description: number of installments chosen by the customer.
            tests:
              - not_null
          - name: payment_value
            description: transaction value.
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - order_id
                  - payment_sequential

      - name: order_reviews
        description: >
          One row per review. review_id and order_id have a documented many-to-many
          relationship in the source data, so neither review_id nor the
          (review_id, order_id) pair is guaranteed unique here — no uniqueness
          test is applied at the source. Uniqueness/allocation is resolved downstream
          in fact_order_reviews.
        columns:
          - name: review_id
            description: Review identifier (not unique)
            tests:
              - not_null
          - name: order_id
            description: order identifier (not unique)
            tests:
              - not_null
          - name: review_score
            description: Note ranging from 1 to 5 given by the customer on a satisfaction survey.
            tests:
              - not_null
          - name: review_comment_title
            description: Comment title from the review left by the customer, in Portuguese.
          - name: review_comment_message
            description: Comment message from the review left by the customer, in Portuguese.
          - name: review_creation_date
            description: the date in which the satisfaction survey was sent to the customer.
            tests:
              - not_null
          - name: review_answer_timestamp
            description: Shows satisfaction survey answer timestamp.
            tests:
              - not_null

      - name: products
        description: One row per product. Grain = product_id.
        columns:
          - name: product_id
            description: unique product identifier
            tests:
              - unique
              - not_null
          - name: product_category_name
            description: root category of product, in Portuguese.
          - name: product_name_lenght
            description: > 
              number of characters extracted from the product name.
              mispelled in source
          - name: product_description_lenght
            description: > 
              number of characters extracted from the product description.
              mispelled in source
          - name: product_photos_qty
            description: number of product published photos
          - name: product_weight_g
            description: product weight measured in grams.
          - name: product_length_cm
            description: product length measured in centimeters.
          - name: product_height_cm
            description: product height measured in centimeters.
          - name: product_width_cm
            description: product width measured in centimeters.
      
      - name: product_category_name_translation
        description: Lookup mapping Portuguese product category names to English. Grain = product_category_name.
        columns:
          - name: product_category_name
            description: category name in Portuguese
            tests:
              - unique
              - not_null
          - name: product_category_name_english
            description: product category name in English
            tests:
              - not_null

      - name: sellers
        description: One row per seller. Grain = seller_id.
        columns:
          - name: seller_id
            description:  seller unique identifier
            tests:
              - unique
              - not_null
          - name: seller_zip_code_prefix
            description: first 5 digits of seller zip code
            tests:
              - not_null
          - name: seller_city
            description: seller city name
            tests:
              - not_null
          - name: seller_state
            description: seller state
            tests:
              - not_null
          - name: seller_name
            description: name of the seller