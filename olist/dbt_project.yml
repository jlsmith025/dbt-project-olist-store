name: 'olist'
version: '1.0.0'
config-version: 2

profile: 'olist'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  "dbt_date:time_zone": "America/Chicago"

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  olist:
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: STAGING
      +materialized: view
    marts:
      +schema: OLIST_MART
      +materialized: table

seeds:
  olist:
    +database: RAW
    +schema: OLIST
    brazil_holidays:
      +column_types:
        holiday_date: date